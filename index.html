<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Little Angel Here</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 450px;
            margin: 0 auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .video-background video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%);
        }

        .video-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: rgba(0, 0, 0, 0.05);
        }

        .content {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            padding: 50px 25px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 40px;
            background: transparent;
        }

        .title-top, .title-bottom {
            font-size: 2.4rem;
            font-weight: 900; 
            line-height: 1.1;
            letter-spacing: -0.5px;
            background-image: url('kupu.gif'); 
            background-size: 80px auto; 
            background-repeat: repeat;  
            background-position: center center;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent; 
            filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.9));
        }

        .title-top {
            text-align: center;
            width: 100%;
        }

        .title-bottom-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 70px; 
            gap: 10px;
            width: 100%;
            margin-top: 5px;
            background: transparent;
        }

        .title-bottom {
            white-space: nowrap;
        }

        .header-cakar {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            pointer-events: none;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.5));
        }

        .header-cakar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 210px; 
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.12); 
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
            z-index: 1;
        }

        .btn img {
            position: absolute;
            left: 22px;
            width: 26px;
            height: 26px;
            object-fit: contain;
            z-index: 5;
        }

        .btn span {
            position: relative;
            z-index: 5;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: width 0.6s ease-out, height 0.6s ease-out, opacity 0.6s ease-out;
            z-index: 3;
        }

        .btn-gold::before {
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(218, 165, 32, 0.05) 70%);
        }

        .btn-green::before {
            background: radial-gradient(circle, rgba(46, 204, 113, 0.4) 0%, rgba(39, 174, 96, 0.05) 70%);
        }

        .btn-tiktok::before {
            background: radial-gradient(circle, rgba(0, 242, 234, 0.45) 0%, rgba(254, 44, 85, 0.05) 70%);
        }

        .btn:hover::before {
            width: 140%; 
            height: 350px;
            opacity: 1;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        }

        /* ========================================================
           KODE BARU: WADAH STICKER CAT2.GIF DI POJOK KANAN BAWAH
           ======================================================== */
        .bottom-right-sticker {
            position: absolute;
            bottom: 25px; /* Jarak dari bawah layar */
            right: 25px;  /* Jarak dari kanan layar */
            width: 100px;  /* Lebar sticker cat2.gif (sesuaikan kebutuhan) */
            height: 100px; /* Tinggi sticker cat2.gif */
            z-index: 10;
            pointer-events: none; /* Supaya tidak mengganggu jempol penonton saat scrol */
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.5)); /* Bayangan estetik */
        }

        .bottom-right-sticker img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* ======================================================== */
    </style>
</head>
<body>

    <div class="container">
        
        <div class="video-background">
            <video autoplay muted loop playsinline id="bgVideo">
                <source src="background.mp4" type="video/mp4">
            </video>
        </div>

        <div class="video-shield"></div>

        <div class="content">
            
            <div class="header-container">
                <h1 class="title-top">Support Little</h1>
                <div class="title-bottom-wrapper">
                    <span class="title-bottom">Angel Here</span>
                    <div class="header-cakar">
                        <img src="cakar.gif" alt="Cat Paw">
                    </div>
                </div>
            </div>

            <div class="button-group">
                <a href="https://bagibagi.co/angeliaputri" class="btn btn-gold" target="_blank">
                    <img src="logo-bagibagi.png" alt="Icon"> <span>Bagi Bagi</span>
                </a>
                
                <a href="https://sociabuzz.com/angeliaputri_/tribe?" class="btn btn-green" target="_blank">
                    <img src="logo-sociabuzz.png" alt="Icon"> <span>Sociabuzz</span>
                </a>

                <a href="https://www.tiktok.com/@angeliaputri1717?lang=id-ID" class="btn btn-tiktok" target="_blank">
                    <img src="logo-tiktok.png" alt="Icon"> <span>TikTok</span>
                </a>
            </div>
        </div>

        <!-- ELEMEN BARU: MENAMPILKAN CAT2.GIF DI POJOK BAWAH KANAN -->
        <div class="bottom-right-sticker">
            <img src="cat2.gif" alt="Cute Cat">
        </div>

    </div>

    <script>
        var video = document.getElementById('bgVideo');
        video.currentTime = 2;
    </script>

</body>
</html>
